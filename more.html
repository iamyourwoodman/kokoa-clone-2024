<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="css/styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More - Kokoa Clone</title>
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>No Service</span>
        <i class="fas fa-wifi"></i>
      </div>
      <div class="status-bar__column">
        <span>18:43</span>
      </div>
      <div class="status-bar__column">
        <span>110%</span>
        <i class="fa-solid fa-battery-full fa-xl"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>
      <header class="screen__header">
  <h1 class="screen__header__title">More</h1>
  <div class="screen__header__icons">
    <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
    <span><i class="fa-solid fa-music fa-lg"></i></span>
    <span
      ><a href="settings.html"><i class="fa-solid fa-gear fa-lg"></i></a>
    </span>
    <span class="badge__dot"></span>
  </div>
</header>
    <main class="main-screen">


      <div class="user-component">
        <div class="user-component__column">
          <img
            src="https://avatars.githubusercontent.com/u/183042386?v=4"
            class="user-component__avatar user-component__avatar"
          />
          <div class="user-component__text">
            <h4 class="user-component__title">Parkoo</h4>
            <h6 class="user-component__subtitle">+82-10-7777-7777</h6>
          </div>
        </div>
        <div class="user-component__column">
          <span><i class="fa-regular fa-message fa-2x"></i></span>
        </div>
      </div>

      <div class="icon-row">
        <div class="icon-row__info">
          <i class="fa-regular fa-calendar fa-2x"></i>
          <span>Calendar</span>
        </div>

        <div class="icon-row__info">
          <i class="fa-regular fa-face-smile fa-2x"></i><span>Emoticons</span>
        </div>
        <div class="icon-row__info">
          <i class="fa-solid fa-paint-roller fa-2x"></i><span>Themes</span>
        </div>
        <div class="icon-row__info">
          <i class="fa-solid fa-file-invoice-dollar fa-2x"></i
          ><span>Account</span>
        </div>
        <div class="icon-row__info">
          <i class="fa-solid fa-file-invoice-dollar fa-2x"></i
          ><span>Account</span>
        </div>
        <div class="icon-row__info">
          <i class="fa-solid fa-file-invoice-dollar fa-2x"></i
          ><span>Account</span>
        </div>
      </div>

      <div class="more-suggestions">
        <h4 class="more-suggestions__title">Suggestions</h4>
        <div class="more-suggestions__icons">
          <div class="more-suggestions__icon">
            <div class="more-suggestions__icon-image">
              <i class="fa-solid fa-tree"></i>
            </div>
            <span class="more-suggestions__icon-text">KaKao Story</span>
          </div>
          <div class="more-suggestions__icon">
            <div class="more-suggestions__icon-image">
              <i class="fa-solid fa-poop"></i>
            </div>
            <span class="more-suggestions__icon-text">KaKao Story</span>
          </div>
        </div>
      </div>

      <div class="open-chat__info">
        <div class="open-chat__text">
          <div class="open-chat__text-title"></div>
          <p class="open-chat__text-tags"></p>
          <div class="open-chat__text-image-line">
            <div class="open-chat__text-image"></div>
            <div class="open-chat__text-members"></div>
            <div class="open-chat__text-active"></div>
          </div>
        </div>
        <div class="open-chat__image"></div>
      </div>
    </main>

    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__btn">
          <a class="nav__link" href="friends.html"
            ><i class="fa-regular fa-user fa-2x"></i
          ></a>
        </li>
        <li class="nav__btn">
          <a class="nav__link" href="chats.html">
            <i class="fa-regular fa-comment fa-2x"></i
          ></a>
        </li>
        <li class="nav__btn">
          <a class="nav__link" href="find.html"
            ><i class="fa-solid fa-magnifying-glass fa-2x"></i
          ></a>
        </li>
        <li class="nav__btn">
          <a class="nav__link" href="more.html"
            ><i class="fa-solid fa-ellipsis fa-2x"></i
          ></a>
        </li>
      </ul>
    </nav>
    <div id="no-mobile">
      <span>Your screen is too big ㅠㅠ</span>
    </div>
    <script
      src="https://kit.fontawesome.com/c63abe3d46.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
